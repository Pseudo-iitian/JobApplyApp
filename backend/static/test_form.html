
<!DOCTYPE html>
<html>
<head><title>Career Form Test</title></head>
<body style="padding: 40px;">
    <h2>Personal Information</h2>
    <div><label>Title*</label><select id="title"><option>Please Select</option><option>Mr.</option><option>Ms.</option></select></div>
    <div><label>First Name*</label><input type="text" id="firstName" /></div>
    <div><label>Last Name*</label><input type="text" id="lastName" /></div>
    <div><label>Email*</label><input type="email" id="email" /></div>
    <div><label>Phone Number Country Code*</label><select id="countryCode"><option>Select</option><option value="+91">India (+91)</option></select></div>
    <div><label>Phone Number*</label><input type="tel" id="phone" /></div>
    <div><label>Country*</label><select id="country"><option>Select</option><option value="India">India</option></select></div>
    <div><label>State*</label><select id="state"><option>Select</option><option value="Uttar Pradesh">Uttar Pradesh</option></select></div>
    <div><label>City*</label><input type="text" id="city" /></div>
    <div><label>Zip / Postal Code*</label><input type="text" id="zip" /></div>
    <div><label>Address Line 1*</label><input type="text" id="address1" /></div>
</body>
</html>
